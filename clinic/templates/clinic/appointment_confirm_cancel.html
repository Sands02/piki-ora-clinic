{% extends "clinic/base.html" %}

{% block title %}Cancel appointment | Piki Ora Medical Centre{% endblock %}

{% block content %}
<div class="card" style="max-width: 560px; margin: 0 auto;">
    <h1>Cancel appointment</h1>
    <p>Are you sure you want to cancel this appointment?</p>
    <p><strong>{{ appointment.slot }}</strong></p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, cancel it</button>
        <a href="{% url 'my_appointments' %}" class="btn btn-grey">Keep appointment</a>
    </form>
</div>
{% endblock %}
