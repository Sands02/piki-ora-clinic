<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Piki Ora Medical Centre{% endblock %}</title>
    <style>
        body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f4f7f9; color: #222; }
        header { background: #1f6f78; color: #fff; padding: 14px 20px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
        header a { color: #fff; text-decoration: none; }
        .brand { font-size: 1.3rem; font-weight: bold; }
        nav { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        nav form { margin: 0; }
        main { max-width: 900px; margin: 30px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .btn { background: #1f6f78; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 1rem; text-decoration: none; display: inline-block; }
        .btn-light { background: #fff; color: #1f6f78; }
        .message { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; background: #e0f2f1; }
        .message.error { background: #fdecea; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-top: 20px; }
        .stat { font-size: 2rem; font-weight: bold; color: #1f6f78; }
    </style>
</head>
<body>
    <header>
        <a class="brand" href="{% url 'home' %}">Piki Ora Medical Centre</a>
        <nav>
            {% if user.is_authenticated %}
                {% if user.is_staff %}
                    <a href="{% url 'dashboard' %}">Dashboard</a>
                {% endif %}
                <span>Hello, {{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-light">Log out</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Log in</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% for message in messages %}
            <div class="message {{ message.tags }}">{{ message }}</div>
        {% endfor %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
