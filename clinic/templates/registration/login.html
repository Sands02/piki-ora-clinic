{% extends "clinic/base.html" %}

{% block title %}Log in | Piki Ora Medical Centre{% endblock %}

{% block content %}
<div class="card" style="max-width: 420px; margin: 0 auto;">
    <h1>Log in</h1>

    {% if form.errors %}
        <div class="message error">Your username or password was incorrect. Please try again.</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label for="id_username">Username</label>
        {{ form.username }}

        <label for="id_password">Password</label>
        {{ form.password }}

        <input type="hidden" name="next" value="{{ next }}">
        <p><button type="submit" class="btn">Log in</button></p>
    </form>
</div>
{% endblock %}
